[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-agent-framework"
version = "0.1.0.dev0"
description = "A Python framework for graph-based agents with tool calling and DeepSeek integration"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["loom"]
